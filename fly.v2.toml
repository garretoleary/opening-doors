# Opening Doors staging on Fly.io, branch night-review only. All data invented.
app = "openingdoors-v2"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENING_DOORS_DATA_DIR = "/data"
  OPENING_DOORS_HOST = "0.0.0.0"
  PORT = "8765"
  OPENING_DOORS_STAGING = "1"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = false      # a run takes two minutes; the machine stays up
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
